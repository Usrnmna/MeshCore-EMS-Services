# Maintained Python and workflow dependencies; no automatic merge or release.
# Shared dependencies are grouped across service packages, data tools, and GUI builds.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-compatible-updates:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: pip
    directories:
      - /.github
      - /meshcore_mqtt_service
      - /meshcore_mqtt_service_windows
      - /data/flood_impacts
      - /data/usgs_water
      - /satellite_database
      - /installers/datasets
      - /installers/datasets/gui
    schedule:
      interval: weekly
    groups:
      qt-runtime:
        patterns: ['PyQt6*', 'pyqt6*']
      shared-python-dependencies:
        patterns: ['*']
        exclude-patterns: ['PyQt6*', 'pyqt6*']
        group-by: dependency-name
    open-pull-requests-limit: 5
