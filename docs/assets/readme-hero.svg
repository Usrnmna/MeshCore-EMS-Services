<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title description">
  <title id="title">MC-EMS-Services: local information through MeshCore</title>
  <desc id="description">Illustrative same-channel exchanges on #autatestbot, using sample values rather than live observations. Alice sends !snowpack Truckee. The service replies: @Alice Snow depth at station: 12in. | Next 24h snow: 4in | Snow Creek 2.3mi. Alice sends !floodwarn Sacramento. The service replies: @Alice No active NWS flood alerts. | Sacramento. Each reply is one message; text is wrapped for display.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1729"/>
      <stop offset="1" stop-color="#143747"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="550" rx="20" fill="url(#background)"/>
  <g fill="none" stroke="#67c8cd" stroke-width="1.5" opacity="0.12">
    <path d="M0 310C160 160 180 420 410 260S640 120 810 270 1050 390 1200 210"/>
    <path d="M0 330C160 180 180 440 410 280S640 140 810 290 1050 410 1200 230"/>
    <path d="M0 350C160 200 180 460 410 300S640 160 810 310 1050 430 1200 250"/>
    <circle cx="1160" cy="40" r="80"/>
    <circle cx="1160" cy="40" r="115"/>
    <circle cx="1160" cy="40" r="150"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="44" y="37" width="36" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="94" y="47" fill="#94d9df" font-size="18" font-weight="700" letter-spacing="2">MC-EMS-SERVICES</text>
    <text x="44" y="116" fill="#f1f5f9" font-size="48" font-weight="700">Local information.</text>
    <text x="44" y="174" fill="#5eead4" font-size="48" font-weight="700">Through MeshCore.</text>
    <text x="46" y="219" fill="#cbd5e1" font-size="21">Weather. Water. Wildfire. Roads. Local maps.</text>
    <text x="46" y="252" fill="#a4bbc9" font-size="19">Linux + Windows  /  USB + BLE + TCP</text>
    <text x="46" y="333" fill="#f1f5f9" font-size="25" font-weight="600">Ask in your channel.</text>
    <text x="46" y="369" fill="#5eead4" font-size="25" font-weight="600">Read the reply in the same channel.</text>
    <text x="46" y="414" fill="#a4bbc9" font-size="16">Illustrative values, not live conditions.</text>
    <text x="46" y="439" fill="#a4bbc9" font-size="16">Reply text is wrapped for display.</text>
    <rect x="600" y="36" width="556" height="434" rx="16" fill="#0b1729" stroke="#355a6a"/>
    <circle cx="622" cy="61" r="4" fill="#5eead4"/>
    <text x="637" y="67" fill="#a4bbc9" font-size="13" font-weight="600" letter-spacing="0.7">CHANNEL #autatestbot | SAMPLE EXCHANGES</text>
    <path d="M620 83H1136" stroke="#284757"/>
    <text x="622" y="105" fill="#a4bbc9" font-size="11" letter-spacing="1">ALICE SENDS</text>
    <rect x="620" y="115" width="516" height="38" rx="8" fill="#163e49"/>
    <text x="636" y="141" fill="#7ff4df" font-family="Consolas, monospace" font-size="21">!snowpack Truckee</text>
    <text x="622" y="176" fill="#a4bbc9" font-size="11" letter-spacing="1">SERVICE REPLIES ON THE SAME CHANNEL</text>
    <rect x="620" y="187" width="516" height="72" rx="8" fill="#132b3b"/>
    <text x="636" y="213" fill="#f1f5f9" font-family="Consolas, monospace" font-size="15">
      <tspan x="636" dy="0">@Alice Snow depth at station: 12in. |</tspan>
      <tspan x="636" dy="24">Next 24h snow: 4in | Snow Creek 2.3mi</tspan>
    </text>
    <path d="M620 280H1136" stroke="#284757"/>
    <text x="622" y="301" fill="#a4bbc9" font-size="11" letter-spacing="1">ALICE SENDS</text>
    <rect x="620" y="311" width="516" height="38" rx="8" fill="#163e49"/>
    <text x="636" y="337" fill="#7ff4df" font-family="Consolas, monospace" font-size="21">!floodwarn Sacramento</text>
    <text x="622" y="372" fill="#a4bbc9" font-size="11" letter-spacing="1">SERVICE REPLIES ON THE SAME CHANNEL</text>
    <rect x="620" y="383" width="516" height="72" rx="8" fill="#132b3b"/>
    <text x="636" y="404" fill="#f1f5f9" font-family="Consolas, monospace" font-size="14">
      <tspan x="636" dy="0">@Alice No active NWS flood alerts. |</tspan>
      <tspan x="636" dy="19">Sacramento</tspan>
    </text>
    <path d="M44 490H1156" stroke="#355a6a"/>
    <text x="46" y="532" fill="#e2e8f0" font-size="18" font-weight="600">31 commands</text>
    <circle cx="237" cy="526" r="3" fill="#5eead4"/>
    <text x="262" y="532" fill="#e2e8f0" font-size="18">Tagged channel replies</text>
    <circle cx="518" cy="526" r="3" fill="#5eead4"/>
    <text x="543" y="532" fill="#e2e8f0" font-size="18">Per-channel programs</text>
    <circle cx="791" cy="526" r="3" fill="#5eead4"/>
    <text x="816" y="532" fill="#e2e8f0" font-size="18">Offline EBMUD GIS</text>
  </g>
</svg>
